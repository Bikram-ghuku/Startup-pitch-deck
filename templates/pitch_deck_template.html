<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Roboto:wght@300;400;500;700;900&family=Open+Sans:wght@300;400;600;700;800&family=Poppins:wght@300;400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/feather-icons@4.29.0/dist/feather.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.min.js"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                        'serif': ['Playfair Display', 'Georgia', 'serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                        'roboto': ['Roboto', 'sans-serif'],
                        'opensans': ['Open Sans', 'sans-serif'],
                        'poppins': ['Poppins', 'sans-serif'],
                        'montserrat': ['Montserrat', 'sans-serif'],
                    },
                    fontSize: {
                        'xs': ['0.75rem', { lineHeight: '1rem' }],
                        'sm': ['0.875rem', { lineHeight: '1.25rem' }],
                        'base': ['1rem', { lineHeight: '1.5rem' }],
                        'lg': ['1.125rem', { lineHeight: '1.75rem' }],
                        'xl': ['1.25rem', { lineHeight: '1.75rem' }],
                        '2xl': ['1.5rem', { lineHeight: '2rem' }],
                        '3xl': ['1.875rem', { lineHeight: '2.25rem' }],
                        '4xl': ['2.25rem', { lineHeight: '2.5rem' }],
                        '5xl': ['3rem', { lineHeight: '1' }],
                        '6xl': ['3.75rem', { lineHeight: '1' }],
                        '7xl': ['4.5rem', { lineHeight: '1' }],
                        '8xl': ['6rem', { lineHeight: '1' }],
                        '9xl': ['8rem', { lineHeight: '1' }],
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
        }

        .presentation-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            visibility: hidden;
            opacity: 0;
            overflow-y: auto;
            pointer-events: none;
        }

        .slide.active {
            visibility: visible !important;
            opacity: 1 !important;
            pointer-events: auto;
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-number {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.9em;
            opacity: 0.6;
        }


        /* Responsive design */
        @media (max-width: 1024px) {
            .slide {
                width: 95%;
                padding: 2rem !important;
            }
        }

        @media (max-width: 768px) {
            .slide {
                padding: 1.5rem !important;
            }
            
            .slide h2 {
                font-size: 2.5rem !important;
                line-height: 1.2 !important;
            }
            
            .slide p, .slide li {
                font-size: 1rem !important;
                line-height: 1.6 !important;
            }
        }

        @media (max-width: 480px) {
            .slide {
                padding: 1rem !important;
            }
            
            .slide h2 {
                font-size: 2rem !important;
            }
        }

        /* Print styles */
        @media print {
            body {
                background: white;
            }

            .slide {
                display: block !important;
                page-break-after: always;
                box-shadow: none;
                max-width: 100%;
                max-height: 100%;
                border-radius: 0;
            }

            .navigation, .notes-toggle, .fullscreen-toggle, .presenter-notes {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="presentation-container">
        {{slides}}
    </div>

    <button class="fixed top-6 left-6 bg-slate-800/90 hover:bg-blue-600/90 text-white px-6 py-3 rounded-full font-semibold text-sm transition-all duration-300 hover:scale-105 backdrop-blur-sm shadow-lg" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    <button class="fixed top-6 right-6 bg-slate-800/90 hover:bg-blue-600/90 text-white px-6 py-3 rounded-full font-semibold text-sm transition-all duration-300 hover:scale-105 backdrop-blur-sm shadow-lg" onclick="toggleNotes()">📝 Notes</button>
    
    <div class="fixed bottom-8 left-1/2 transform -translate-x-1/2 flex items-center gap-4 bg-slate-800/95 px-8 py-4 rounded-full shadow-2xl backdrop-blur-md">
        <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-full font-semibold text-sm transition-all duration-300 hover:scale-105 disabled:bg-slate-500 disabled:cursor-not-allowed disabled:opacity-50" id="prevBtn" onclick="previousSlide()">← Prev</button>
        <span class="text-white font-semibold text-sm min-w-[70px] text-center">
            <span id="currentSlide">1</span> / <span id="totalSlides">1</span>
        </span>
        <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-full font-semibold text-sm transition-all duration-300 hover:scale-105 disabled:bg-slate-500 disabled:cursor-not-allowed disabled:opacity-50" id="nextBtn" onclick="nextSlide()">Next →</button>
    </div>

    <div class="fixed bottom-32 left-1/2 transform -translate-x-1/2 bg-slate-800/98 text-white p-8 rounded-xl max-w-2xl hidden text-sm leading-relaxed shadow-2xl backdrop-blur-md" id="presenterNotes"></div>

    <script>
        let currentSlideIndex = 0;
        let showNotes = false;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;

        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            
            if (index >= 0 && index < totalSlides) {
                currentSlideIndex = index;
                slides[currentSlideIndex].classList.add('active');
                
                document.getElementById('currentSlide').textContent = currentSlideIndex + 1;
                document.getElementById('totalSlides').textContent = totalSlides;
                
                document.getElementById('prevBtn').disabled = currentSlideIndex === 0;
                document.getElementById('nextBtn').disabled = currentSlideIndex === totalSlides - 1;
                
                updateNotes();
            }
        }

        function nextSlide() {
            if (currentSlideIndex < totalSlides - 1) {
                showSlide(currentSlideIndex + 1);
            }
        }

        function previousSlide() {
            if (currentSlideIndex > 0) {
                showSlide(currentSlideIndex - 1);
            }
        }

        function toggleNotes() {
            showNotes = !showNotes;
            updateNotes();
        }

        function updateNotes() {
            const notesDiv = document.getElementById('presenterNotes');
            const currentSlide = slides[currentSlideIndex];
            const notes = currentSlide.getAttribute('data-notes');
            
            if (showNotes && notes) {
                notesDiv.textContent = notes;
                notesDiv.classList.remove('hidden');
                notesDiv.classList.add('block');
            } else {
                notesDiv.classList.add('hidden');
                notesDiv.classList.remove('block');
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowRight':
                case ' ':
                case 'PageDown':
                    nextSlide();
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'PageUp':
                    previousSlide();
                    e.preventDefault();
                    break;
                case 'Home':
                    showSlide(0);
                    e.preventDefault();
                    break;
                case 'End':
                    showSlide(totalSlides - 1);
                    e.preventDefault();
                    break;
                case 'n':
                case 'N':
                    toggleNotes();
                    break;
                case 'f':
                case 'F':
                    toggleFullscreen();
                    break;
            }
        });

        // Initialize
        showSlide(0);
    </script>
</body>
</html>
